# Causal rules of the CPU domain (ADR 0034, 0040), formalised from the
# research dossier docs/research/cpu.md, causes C1-C6. Format as in
# disk.toml.
#
# CPU pressure appears only when runnable threads reach the CPU count
# (Gregg p. 257); host pressure includes the culprit's own threads, so with
# a culprit the harm is read on the others. `cpu.iowait_ratio` and
# `cpu.blocked_tasks` reflect waiting on the disk and memory and cannot be
# evidence here (cross-effects dossier; the loader refuses them).

#################################################################
# C1. CPU hog
#################################################################

[[rule]]
cause = "cpu_hog"
provenance = { source = "docs/research/cpu.md C1; Gregg pp. 222, 226, 257; Love p. 45", grade = "documented" }

[[rule.manifestation]]
anomaly = "cgroup.cpu_cores"
direction = "up"
role = "culprit"
anchor = true
strength = "characteristic"
provenance = { source = "admin-guide/cgroup-v2 cpu.stat usage_usec", grade = "documented" }

[[rule.manifestation]]
anomaly = "cpu.idle_ratio"
direction = "down"
role = "host"
window = [-15, 30]
strength = "characteristic"
provenance = { source = "Gregg p. 226: at 100 % utilization threads wait to run", grade = "documented" }

[[rule.manifestation]]
anomaly = "cpu.runnable_tasks"
direction = "up"
role = "host"
window = [-15, 30]
strength = "typical"
provenance = { source = "Gregg p. 258; calibration run 20261029T114359Z cpu-100: 19 runnable", grade = "documented" }

[[rule.manifestation]]
anomaly = "cgroup.cpu_pressure_some_ratio"
direction = "up"
role = "others"
window = [-15, 60]
strength = "characteristic"
harm = true
provenance = { source = "accounting/psi; calibration run 20261029T114359Z cpu-100: others up to 0.029", grade = "documented" }

[[rule.manifestation]]
anomaly = "cpu.pressure_some_ratio"
direction = "up"
role = "host"
window = [-15, 60]
strength = "typical"
provenance = { source = "Gregg p. 257, table 6.10", grade = "documented" }

[[rule.manifestation]]
anomaly = "cpu.temperature_c"
direction = "up"
role = "host"
window = [0, 300]
strength = "possible"
provenance = { source = "docs/research/cpu.md C1, inferred from Gregg p. 230", grade = "unverified" }

#################################################################
# C2. Process churn
#################################################################

[[rule]]
cause = "process_churn"
provenance = { source = "docs/research/cpu.md C2; Gregg pp. 207, 250, 262", grade = "documented" }

[[rule.manifestation]]
anomaly = "cpu.forks_per_s"
direction = "up"
role = "host"
anchor = true
strength = "characteristic"
provenance = { source = "proc_stat(5) processes; overhead run 20261028T195813Z fork: 12 k/s", grade = "documented" }

[[rule.manifestation]]
anomaly = "cpu.system_ratio"
direction = "up"
role = "host"
window = [-15, 30]
strength = "characteristic"
provenance = { source = "Gregg p. 250 (execve in the kernel); overhead run 20261028T195813Z fork: 0.22 against 0.004", grade = "documented" }

[[rule.manifestation]]
anomaly = "cpu.context_switches_per_s"
direction = "up"
role = "host"
window = [-15, 30]
strength = "typical"
provenance = { source = "overhead run 20261028T195813Z fork: 62 k/s against 6 k/s", grade = "measured" }

[[rule.manifestation]]
anomaly = "cgroup.cpu_cores"
direction = "up"
role = "culprit"
window = [-15, 30]
strength = "characteristic"
provenance = { source = "admin-guide/cgroup-v2 cpu.stat; fork and exec are charged to the forking group", grade = "documented" }

[[rule.manifestation]]
anomaly = "cgroup.cpu_pressure_some_ratio"
direction = "up"
role = "others"
window = [-15, 60]
strength = "characteristic"
harm = true
provenance = { source = "accounting/psi", grade = "documented" }

[[rule.manifestation]]
event = "unit_failed"
window = [-300, 60]
strength = "possible"
provenance = { source = "docs/research/cpu.md C2, inferred: a crash-restart loop", grade = "unverified" }

