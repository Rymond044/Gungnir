# Causal rules of the disk domain (ADR 0034), formalised from the research
# dossier docs/research/disk-io.md, causes D1-D9. Each rule names a root
# cause of the ontology and the manifestations it is expected to produce.
#
# A manifestation is one of four kinds:
#   anomaly = signal(s)  a record of the series in `direction` ("up" or
#                        "down"); `record` narrows it to "anomaly" or
#                        "impact" (with `level`), default any record
#   value   = signal(s)  a context value detection attached to a record of
#                        the same entity, `at_most` or `above` a bound
#   event   = type(s)    a kernel or journal event of the host
#   sign    = sign(s)    a process sign in the process snapshot
# A list means any one of them; it counts once.
#
# `role` is the entity it is expected on: culprit, others, device,
# filesystem, host. One manifestation is the `anchor`; the `window` of every
# other one is [min, max] seconds from the anchor's start. `strength` is
# characteristic, typical or possible; `harm = true` marks the harm the
# cause does. Rule conditions: `requires` and `excludes` name context facts
# or `culprit_class`, the workload class whose rules match the culprit's
# group. Grades follow the dossier: documented, measured (seen in a labeled
# run), unverified (inferred there; to be confirmed by an S9 scenario).
#
# Every rule except D9 excludes a maintenance culprit: with the same
# manifestations, a maintenance unit makes D9.

#################################################################
# D1. Bulk sequential writer
#################################################################

[[rule]]
cause = "bulk_sequential_writer"
excludes = { culprit_class = "maintenance" }
provenance = { source = "docs/research/disk-io.md D1; Gregg p. 434; Love p. 300", grade = "documented" }

[[rule.manifestation]]
anomaly = "cgroup.write_bytes_per_s"
direction = "up"
role = "culprit"
anchor = true
strength = "characteristic"
provenance = { source = "admin-guide/cgroup-v2 io.stat wbytes", grade = "documented" }

[[rule.manifestation]]
anomaly = "disk.write_bytes_per_s"
direction = "up"
role = "device"
window = [-15, 30]
strength = "characteristic"
provenance = { source = "Gregg p. 460", grade = "documented" }

[[rule.manifestation]]
value = "disk.write_request_bytes"
above = 8192
role = "device"
window = [-15, 30]
strength = "characteristic"
provenance = { source = "Gregg p. 461: sizes over 8 KiB are large I/O or a merged sequential workload; calibration run 20261029T114359Z seqwrite ~130 KiB", grade = "documented" }

[[rule.manifestation]]
anomaly = "disk.queue_depth"
direction = "up"
role = "device"
window = [-15, 30]
strength = "typical"
provenance = { source = "Gregg p. 434: saturation is the queue beyond what the device delivers", grade = "documented" }

[[rule.manifestation]]
anomaly = "disk.read_await_ms"
direction = "up"
role = "device"
window = [-15, 60]
strength = "typical"
provenance = { source = "Love p. 300 (writes starving reads); Gregg p. 461", grade = "documented" }

[[rule.manifestation]]
anomaly = "cgroup.io_pressure_some_ratio"
direction = "up"
role = "others"
window = [-15, 60]
strength = "characteristic"
harm = true
provenance = { source = "accounting/psi: share of time tasks of the group stalled on I/O", grade = "documented" }

[[rule.manifestation]]
sign = "waiting_on_io"
role = "others"
window = [-15, 60]
strength = "possible"
harm = true
provenance = { source = "ADR 0038; proc_pid_stat(5) state D", grade = "documented" }

[[rule.manifestation]]
anomaly = "cpu.blocked_tasks"
direction = "up"
role = "host"
window = [-15, 60]
strength = "possible"
provenance = { source = "docs/research/disk-io.md D1, inferred from Gregg p. 195", grade = "unverified" }

[[rule.manifestation]]
anomaly = "disk.util_ratio"
direction = "up"
role = "device"
window = [-15, 30]
strength = "possible"
provenance = { source = "iostat(1) %util: not a limit for devices serving requests in parallel; Gregg p. 433", grade = "documented" }

