direction = "up"
role = "culprit"
anchor = true
strength = "characteristic"
provenance = { source = "admin-guide/cgroup-v2 io.stat rbytes", grade = "documented" }

[[rule.manifestation]]
anomaly = ["disk.read_bytes_per_s", "disk.read_ops_per_s"]
direction = "up"
role = "device"
window = [-15, 30]
strength = "characteristic"
provenance = { source = "Gregg p. 460", grade = "documented" }

# Typical, not characteristic: a directory scan reads small metadata blocks.
[[rule.manifestation]]
value = "disk.read_request_bytes"
above = 8192
role = "device"
window = [-15, 30]
strength = "typical"
provenance = { source = "Gregg p. 461; calibration run 20261029T114359Z seqread ~130 KiB", grade = "documented" }

[[rule.manifestation]]
anomaly = "disk.read_await_ms"
direction = "up"
role = "device"
window = [-15, 60]
strength = "typical"
provenance = { source = "Gregg p. 461", grade = "documented" }

[[rule.manifestation]]
anomaly = "cgroup.io_pressure_some_ratio"
direction = "up"
role = "others"
window = [-15, 60]
strength = "characteristic"
harm = true
provenance = { source = "accounting/psi; calibration run 20261029T114359Z seqread: others up to 0.39", grade = "documented" }

[[rule.manifestation]]
sign = "waiting_on_io"
role = "others"
window = [-15, 60]
strength = "possible"
harm = true
provenance = { source = "ADR 0038; proc_pid_stat(5) state D", grade = "documented" }

[[rule.manifestation]]
anomaly = "mem.major_faults_per_s"
direction = "up"
role = "host"
window = [0, 600]
strength = "possible"
provenance = { source = "docs/research/disk-io.md D2, inferred from Gregg p. 365 (unneeded reads pollute the cache)", grade = "unverified" }

