[[rule.manifestation]]
anomaly = "disk.queue_depth"
direction = "up"
role = "device"
window = [-15, 30]
strength = "typical"
provenance = { source = "calibration run 20261029T114359Z randwrite: median 41, max 808", grade = "measured" }

[[rule.manifestation]]
anomaly = "cgroup.io_pressure_some_ratio"
direction = "up"
role = "others"
window = [-15, 60]
strength = "characteristic"
harm = true
provenance = { source = "accounting/psi", grade = "documented" }

[[rule.manifestation]]
sign = "waiting_on_io"
role = "others"
