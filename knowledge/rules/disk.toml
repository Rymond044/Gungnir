[[rule.manifestation]]
anomaly = ["cgroup.read_bytes_per_s", "cgroup.write_bytes_per_s"]
direction = "up"
role = "culprit"
anchor = true
strength = "characteristic"
provenance = { source = "admin-guide/cgroup-v2 io.stat", grade = "documented" }

[[rule.manifestation]]
anomaly = ["disk.read_ops_per_s", "disk.write_ops_per_s"]
direction = "up"
role = "device"
window = [-15, 30]
strength = "characteristic"
provenance = { source = "Gregg p. 461: the device runs out of operations before bytes", grade = "documented" }

[[rule.manifestation]]
value = ["disk.read_request_bytes", "disk.write_request_bytes"]
