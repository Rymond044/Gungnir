# Impact (ADR 0025): absolute thresholds on waiting, not on load. Two
# levels: noticeable and severe. A baseline would learn a harmful habit as
# normal, so impact never uses one. `samples` is how many samples in a row
# open a record (default 3). Host-local overrides go to local/<host>.toml
# as [[impact]] entries with the same signal and level.
#
# Only severe memory pressure has a published source. The other levels are
# initial values to be measured in the calibration run and the S9 scenarios;
# until then they are graded unverified.

[[impact]]
signal = "mem.pressure_full_ratio"
level = "severe"
above = 0.60
samples = 6
provenance = { source = "oomd.conf(5): DefaultMemoryPressureLimit = 60 % of a 10 s window with all tasks delayed (full), held DefaultMemoryPressureDurationSec = 30 s", grade = "documented" }

[[impact]]
signal = "cgroup.mem_pressure_full_ratio"
level = "severe"
above = 0.60
samples = 6
provenance = { source = "oomd.conf(5): DefaultMemoryPressureLimit = 60 % for a unit's control group, held 30 s", grade = "documented" }

[[impact]]
signal = "mem.pressure_some_ratio"
level = "noticeable"
above = 0.10
provenance = { source = "initial value, to be measured in scenarios (ADR 0025)", grade = "unverified" }

[[impact]]
signal = "io.pressure_some_ratio"
level = "noticeable"
above = 0.10
provenance = { source = "trials of 2026-10-30: a program calling fsync 200 times a second waited 0.06 alone and 0.12-0.17 beside a buffered writer flooding the page cache; over three days of samples only labeled runs, plocate-updatedb and grub-btrfsd stayed above 0.10 for three samples in a row", grade = "measured" }

[[impact]]
signal = "io.pressure_full_ratio"
level = "severe"
above = 0.50
provenance = { source = "initial value, to be measured in scenarios (ADR 0025)", grade = "unverified" }

[[impact]]
signal = "cpu.pressure_some_ratio"
level = "noticeable"
above = 0.10
provenance = { source = "culprit run 20261030T191333Z cpu_hog: 18 busy workers on 18 CPUs, a 0.3-core program waited 0.13 on average (0.07-0.21), the host 0.045; idle median 0.001", grade = "measured" }

[[impact]]
signal = "disk.read_await_ms"
level = "noticeable"
above = 50
provenance = { source = "initial value, to be measured in scenarios (ADR 0025)", grade = "unverified" }

[[impact]]
signal = "disk.write_await_ms"
level = "noticeable"
above = 50
provenance = { source = "initial value, to be measured in scenarios (ADR 0025)", grade = "unverified" }

# A full filesystem harms whoever writes to it: writes slow down, then fail
# (Gregg, Systems Performance, 2nd ed., p. 371). It is the harm of the disk
# causes "filesystem filled" and "filesystem full" (docs/research/disk-io.md).
[[impact]]
signal = "fs.used_ratio"
level = "severe"
above = 0.90
samples = 60
provenance = { source = "Zabbix template Linux by Zabbix agent: Space is critically low, {$VFS.FS.PUSED.MAX.CRIT} = 90 (%), min over 5m", grade = "documented" }

# A killed process is harm whatever else happens, so one sample opens the
# record (docs/research/memory.md MG2). Reaching memory.max means reclaim
# and stalls inside the group; memory.high events are not impact, since
# gungnIR's own action sets memory.high.
[[impact]]
signal = "mem.oom_kills"
level = "severe"
above = 0
samples = 1
provenance = { source = "Gregg p. 324: OOM killer sacrifices are memory saturation; Bovet p. 710", grade = "documented" }

[[impact]]
signal = "cgroup.oom_kills"
level = "severe"
above = 0
samples = 1
provenance = { source = "admin-guide/cgroup-v2 memory.events oom_kill: processes of the group killed by any OOM killer", grade = "documented" }

[[impact]]
signal = "cgroup.mem_max_events"
level = "noticeable"
above = 0
samples = 1
provenance = { source = "admin-guide/cgroup-v2 memory.max: at the limit the group is reclaimed, then OOM-killed; memory.events max", grade = "documented" }
