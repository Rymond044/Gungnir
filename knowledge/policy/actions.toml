#################################################################
# Advisories
#################################################################

[[advisory]]
cause = "writeback_storm"
text = "Writeback is host-wide: an administrator can lower vm.dirty_background_bytes and vm.dirty_bytes so that flushing starts earlier and in smaller bursts. Do not run sync or drop caches: that forces exactly the flush that hurts."
provenance = { source = "docs/research/disk-io.md D5; admin-guide/sysctl/vm dirty_*; Love pp. 331-332", grade = "documented" }

[[advisory]]
cause = "filesystem_filled"
text = "The group named as culprit has been filling the filesystem. Find what it writes; space usually goes to logs (journalctl --vacuum-size), package caches, old snapshots and container images. Limiting its I/O only slows the filling; nothing is deleted automatically."
provenance = { source = "docs/research/disk-io.md D6; journald.conf(5) SystemMaxUse=; Gregg p. 371", grade = "documented" }

[[advisory]]
cause = "filesystem_full"
text = "The filesystem is nearly full and no writer is active now. Space usually goes to logs (journalctl --vacuum-size), package caches, old snapshots and container images. Nothing is deleted automatically."
provenance = { source = "docs/research/disk-io.md D7; Gregg p. 371", grade = "documented" }

[[advisory]]
cause = "device_errors"
text = "The device reports errors. Copy important data off it now, read its SMART data (smartctl -a), and check the cable and the firmware. Limiting I/O does not help."
provenance = { source = "docs/research/disk-io.md D8; Gregg p. 451 (errors first in the USE method; smartctl)", grade = "documented" }

[[advisory]]
cause = "memory_leak"
text = "The group named as culprit has grown for hours. Restart its service at a convenient time and report the leak: the fix is in the program. Check first whether it is a cache warming up, which stops growing."
provenance = { source = "docs/research/memory.md M1; Gregg p. 327", grade = "documented" }

[[advisory]]
cause = "memory_hog"
text = "The group named as culprit allocated much memory at once. If this is its normal work, give it MemoryHigh= in its unit or run it when the host is free; add memory or swap if it must run alongside the others."
provenance = { source = "docs/research/memory.md M2; systemd.resource-control(5) MemoryHigh=", grade = "documented" }

[[advisory]]
cause = "memory_exhaustion"
text = "The kernel killed a process to free memory. The journal names the victim; the group that grew before it is the likely cause. Set MemoryHigh= on that unit, and add swap or memory if the host's work does not fit."
provenance = { source = "docs/research/memory.md M3; Gregg p. 324; Bovet p. 710", grade = "documented" }

[[advisory]]
cause = "group_memory_limit"
text = "A group reached its own MemoryMax= and was reclaimed or OOM-killed inside it while the host had memory. Raise the limit in its unit or find why it grows; gungnIR does not change configured limits."
provenance = { source = "docs/research/memory.md M4; admin-guide/cgroup-v2 memory.max; Gregg p. 317", grade = "documented" }

[[advisory]]
cause = "group_memory_throttled"
text = "A group is held at its MemoryHigh= and its processes are throttled. If gungnIR set the limit, it is rolled back by its timer; otherwise raise MemoryHigh= in the unit or reduce what the program keeps in memory."
provenance = { source = "docs/research/memory.md M5; admin-guide/cgroup-v2 memory.high", grade = "documented" }

[[advisory]]
cause = "tmpfs_growth"
text = "Files in tmpfs hold memory. Check df -h /tmp /dev/shm /run and remove what is no longer needed; nothing is deleted automatically."
provenance = { source = "docs/research/memory.md M6; filesystems/proc meminfo Shmem", grade = "documented" }

[[advisory]]
cause = "kernel_memory_growth"
text = "Kernel memory that cannot be reclaimed keeps growing. slabtop names the cache; a kernel or driver update usually fixes it, and a reboot frees it."
provenance = { source = "docs/research/memory.md M7; Gregg pp. 318, 325", grade = "documented" }

[[advisory]]
cause = "page_cache_thrashing"
text = "The programs' working data no longer fits in memory and is read from disk again and again. Reduce what runs at once or add memory; limiting their I/O only makes every re-read slower."
provenance = { source = "docs/research/cross-effects.md X2; Gregg pp. 310, 390", grade = "documented" }

[[advisory]]
cause = "swap_io"
text = "Memory is short and pages move to and from swap. Set MemoryHigh= on the group that grew, or add memory."
provenance = { source = "docs/research/cross-effects.md X1; Gregg pp. 306-307", grade = "documented" }

[[advisory]]
cause = "process_churn"
text = "Many short-lived processes are being started. Replace external commands in loops with shell built-ins; for a service that keeps restarting, read its unit's log."
provenance = { source = "docs/research/cpu.md C2; Gregg pp. 207, 250", grade = "documented" }

[[advisory]]
cause = "interrupt_storm"
text = "Interrupt handling takes the CPU. /proc/interrupts shows which line rises; check that device, its driver and its firmware."
provenance = { source = "docs/research/cpu.md C3; Gregg pp. 259, 281", grade = "documented" }

[[advisory]]
cause = "cpu_quota_throttling"
text = "A group is held at its own CPUQuota=. Raise the quota in its unit or reduce its work; tightening it further makes it worse."
provenance = { source = "docs/research/cpu.md C4; admin-guide/cgroup-v2 cpu.max; Gregg p. 246", grade = "documented" }

[[advisory]]
cause = "thermal_throttling"
text = "The processor overheats and lowers its clock. Check the fan and the vents for dust, keep the laptop on a hard surface, and choose a quieter power profile; reducing sustained load helps too."
provenance = { source = "docs/research/cpu.md C5; Gregg pp. 230-231, 245", grade = "documented" }

[[advisory]]
cause = "cpu_steal"
text = "The hypervisor gives this virtual machine's CPUs to others. Check the host's other guests or the instance's CPU limit; move or resize the machine."
provenance = { source = "docs/research/cpu.md C6; Gregg pp. 595, 604", grade = "documented" }

#################################################################
# Contraindications
#################################################################

[[contraindication]]
cause = "swap_io"
actions = ["io_max_rbps", "io_max_wbps", "io_max_riops", "io_max_wiops"]
reason = "throttling swap I/O lengthens every page-in of the victims"
provenance = { source = "docs/research/disk-io.md D10, inferred", grade = "unverified" }

[[contraindication]]
cause = "page_cache_thrashing"
actions = ["io_max_rbps", "io_max_wbps", "io_max_riops", "io_max_wiops"]
reason = "throttling the re-reads lengthens every page fault of the victims"
provenance = { source = "docs/research/cross-effects.md X2, inferred as for D10", grade = "unverified" }

[[contraindication]]
cause = "cpu_quota_throttling"
actions = ["cpu_max"]
reason = "the group already waits at its own quota"
provenance = { source = "docs/research/cpu.md C4; Gregg p. 246", grade = "documented" }
