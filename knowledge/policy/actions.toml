# Action policy (ADR 0035): which action treats which root cause, from the
# research dossiers docs/research/{disk-io,memory,cpu,cross-effects}.md.
#
# [[policy]]: an action type of the ontology on the entity of `target` (a
# role; the culprit for now). `parameter` is relative to what the target
# consumes now: `share` of the current value of `signal` on it. `when`
# names the alternative of the rule's culprit manifestation that must have
# matched, where a rule allows reads or writes. A weight (an action the
# ontology marks proportional) takes `parameter = { share = ... }`, a share
# of its current weight. `requires`/`excludes` name
# context facts as in the rules. Effectiveness and the likelihood of each
# side effect are in the words of strength (ADR 0034).
#
# The share 0.5 is ADR 0035's initial value, to be calibrated on the S9
# scenarios. Proportional controls (io.weight, ionice) need BFQ or iocost,
# which no host has so far; they enter with that condition when one does.
#
# [[advisory]]: what to tell the user where no action of the actuator
# applies or helps. [[contraindication]]: actions never proposed for a
# cause; the loader refuses a policy entry that names one.

#################################################################
# Actions
#################################################################

[[policy]]
cause = "bulk_sequential_writer"
action = "io_max_wbps"
target = "culprit"
parameter = { signal = "cgroup.write_bytes_per_s", share = 0.5 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit finishes its writes later", likelihood = "characteristic" }]
provenance = { source = "docs/research/disk-io.md D1; admin-guide/cgroup-v2 io.max: blk-throttle delays I/O above the limit on every scheduler, removed by writing max", grade = "documented" }

[[policy]]
cause = "bulk_reader"
action = "io_max_rbps"
target = "culprit"
parameter = { signal = "cgroup.read_bytes_per_s", share = 0.5 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit finishes its reads later", likelihood = "characteristic" }]
provenance = { source = "docs/research/disk-io.md D2; admin-guide/cgroup-v2 io.max", grade = "documented" }

[[policy]]
cause = "small_random_io"
action = "io_max_riops"
target = "culprit"
when = "cgroup.read_bytes_per_s"
parameter = { signal = "cgroup.read_ops_per_s", share = 0.5 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit finishes its reads later", likelihood = "characteristic" }]
provenance = { source = "docs/research/disk-io.md D3; admin-guide/cgroup-v2 io.max riops; ADR 0036 (group operations)", grade = "documented" }

[[policy]]
cause = "small_random_io"
action = "io_max_wiops"
target = "culprit"
when = "cgroup.write_bytes_per_s"
parameter = { signal = "cgroup.write_ops_per_s", share = 0.5 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit finishes its writes later", likelihood = "characteristic" }]
provenance = { source = "docs/research/disk-io.md D3; admin-guide/cgroup-v2 io.max wiops; ADR 0036 (group operations)", grade = "documented" }

[[policy]]
cause = "sync_write_storm"
action = "io_max_wiops"
target = "culprit"
parameter = { signal = "cgroup.write_ops_per_s", share = 0.5 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit waits longer for each commit", likelihood = "characteristic" }]
provenance = { source = "docs/research/disk-io.md D4; admin-guide/cgroup-v2 io.max wiops", grade = "documented" }

[[policy]]
cause = "writeback_storm"
action = "io_max_wbps"
target = "culprit"
parameter = { signal = "cgroup.write_bytes_per_s", share = 0.5 }
effectiveness = "typical"
side_effects = [
    { effect = "the culprit finishes its writes later", likelihood = "characteristic" },
    { effect = "the culprit holds more dirty memory, which counts against its memory; watch cgroup.mem_bytes", likelihood = "possible" },
]
provenance = { source = "docs/research/disk-io.md D5; admin-guide/cgroup-v2 Writeback: the io controller writes out dirty pages per memory domain, and per-group dirty limits apply", grade = "documented" }

[[policy]]
cause = "filesystem_maintenance"
action = "io_max_rbps"
target = "culprit"
when = "cgroup.read_bytes_per_s"
parameter = { signal = "cgroup.read_bytes_per_s", share = 0.5 }
effectiveness = "typical"
side_effects = [{ effect = "the maintenance job takes longer", likelihood = "characteristic" }]
provenance = { source = "docs/research/disk-io.md D9; btrfs-scrub(8): use cgroup2 bandwidth limits through systemd where the scheduler is not BFQ", grade = "documented" }

[[policy]]
cause = "filesystem_maintenance"
action = "io_max_wbps"
target = "culprit"
when = "cgroup.write_bytes_per_s"
parameter = { signal = "cgroup.write_bytes_per_s", share = 0.5 }
effectiveness = "typical"
side_effects = [{ effect = "the maintenance job takes longer", likelihood = "characteristic" }]
provenance = { source = "docs/research/disk-io.md D9; btrfs-balance(8) Performance implications; admin-guide/cgroup-v2 io.max", grade = "documented" }

# Memory. memory.high throttles and reclaims above it and never OOM-kills
# (admin-guide/cgroup-v2); the share keeps a leak 10 % of room and stops a
# fast grower where it stands.

[[policy]]
cause = "memory_leak"
action = "memory_high"
target = "culprit"
parameter = { signal = "cgroup.mem_bytes", share = 1.1 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit runs slower and its own pages are reclaimed or swapped", likelihood = "characteristic" }]
provenance = { source = "docs/research/memory.md M1; admin-guide/cgroup-v2 memory.high: the main mechanism to control memory usage", grade = "documented" }

[[policy]]
cause = "memory_hog"
action = "memory_high"
target = "culprit"
parameter = { signal = "cgroup.mem_bytes", share = 1.0 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit runs slower and its own pages are reclaimed or swapped", likelihood = "characteristic" }]
provenance = { source = "docs/research/memory.md M2; admin-guide/cgroup-v2 memory.high", grade = "documented" }

# The grower may already be the victim of the kill.
[[policy]]
cause = "memory_exhaustion"
action = "memory_high"
target = "culprit"
parameter = { signal = "cgroup.mem_bytes", share = 1.0 }
effectiveness = "possible"
side_effects = [{ effect = "the culprit runs slower and its own pages are reclaimed or swapped", likelihood = "characteristic" }]
provenance = { source = "docs/research/memory.md M3; admin-guide/cgroup-v2 memory.high", grade = "documented" }

# Throttling the grower makes it reclaim its own pages instead of the others'.
[[policy]]
cause = "swap_io"
action = "memory_high"
target = "culprit"
parameter = { signal = "cgroup.mem_bytes", share = 1.0 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit swaps harder and slows down", likelihood = "characteristic" }]
provenance = { source = "docs/research/cross-effects.md X1; admin-guide/cgroup-v2 memory.high", grade = "documented" }

# CPU. The weight acts only under contention, so it is proposed first; the
# bandwidth limit holds whatever the others do.

[[policy]]
cause = "cpu_hog"
action = "cpu_weight"
target = "culprit"
parameter = { share = 0.25 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit runs slower while others want the CPU", likelihood = "characteristic" }]
provenance = { source = "docs/research/cpu.md C1; admin-guide/cgroup-v2 cpu.weight (default 100); Gregg p. 253 (shares)", grade = "documented" }

[[policy]]
cause = "cpu_hog"
action = "cpu_max"
target = "culprit"
parameter = { signal = "cgroup.cpu_cores", share = 0.5 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit runs slower even when CPUs are idle", likelihood = "characteristic" }]
provenance = { source = "docs/research/cpu.md C1; admin-guide/cgroup-v2 cpu.max", grade = "documented" }

[[policy]]
cause = "process_churn"
action = "cpu_weight"
target = "culprit"
parameter = { share = 0.25 }
effectiveness = "typical"
side_effects = [{ effect = "the culprit runs slower while others want the CPU", likelihood = "characteristic" }]
provenance = { source = "docs/research/cpu.md C2; admin-guide/cgroup-v2 cpu.weight", grade = "documented" }

[[policy]]
cause = "process_churn"
