# The interface and the server's API under one origin: the browser talks
# only to this nginx, which passes /api to the server container.
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # File names under assets/ carry a content hash.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Routes of the single-page application.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
