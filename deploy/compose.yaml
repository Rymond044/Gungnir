# Server, its database and the web interface. Every port is bound to
# localhost only: agents on other machines need TLS first, and the
# interface has no login yet (NFR-8, docs/open-questions.md).
name: gungnir

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: gungnir
      POSTGRES_PASSWORD: ${GUNGNIR_DB_PASSWORD:-gungnir}
      POSTGRES_DB: gungnir
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gungnir", "-d", "gungnir"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build: ../server
    environment:
      GUNGNIR_DATABASE_URL: postgresql://gungnir:${GUNGNIR_DB_PASSWORD:-gungnir}@db:5432/gungnir
      GUNGNIR_KNOWLEDGE_DIR: /app/knowledge
    # Rules and thresholds with provenance; operator rules are added from
    # the host (`uv run gungnir-server workload assign ...`), hence read-only.
    volumes:
      - ../knowledge:/app/knowledge:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  web:
    build: ../web
    depends_on:
      - server
    ports:
      - "127.0.0.1:3000:8080"
    restart: unless-stopped

volumes:
  db:
